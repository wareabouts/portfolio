<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Hello Peter</title>
  <!-- Target of the QR code on the Peterbox home screen. Standalone page, outside the React app. -->
  <style>
    html, body { margin: 0; height: 100%; background: #000; }
    body { display: flex; align-items: center; justify-content: center; }
    video { display: block; max-width: 100vw; max-height: 100vh; max-height: 100dvh; }
    #sound {
      position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
      padding: 12px 20px; border: 0; border-radius: 999px;
      background: rgba(255,255,255,.9); color: #000;
      font: 600 16px/1 -apple-system, system-ui, sans-serif; cursor: pointer;
    }
    #sound[hidden] { display: none; }
  </style>
</head>
<body>
  <video src="/video/hellopeter.mp4" autoplay playsinline preload="auto"></video>
  <button id="sound" hidden>Tap for sound</button>
  <script>
    var video = document.querySelector('video');
    var sound = document.getElementById('sound');

    // Browsers only allow autoplay with sound after the visitor has interacted
    // with the site. Try that first; otherwise autoplay muted and offer sound.
    function start() {
      video.muted = false;
      video.play().catch(function () {
        video.muted = true;
        sound.hidden = false;
        video.play().catch(function () { video.controls = true; });
      });
    }
    function unmute() {
      video.muted = false;
      video.controls = true;
      sound.hidden = true;
      video.play();
    }
    sound.addEventListener('click', unmute);
    video.addEventListener('click', function () { if (video.muted) unmute(); });
    start();
  </script>
  <script src="/peterbox-notify.js"></script>
  <script>
    peterboxNotify('Hello Peter', 'Home QR page opened', 'eyes');
    video.addEventListener('ended', function () {
      peterboxNotify('Hello Peter', 'Watched the video to the end', 'white_check_mark');
    }, { once: true });
  </script>
</body>
</html>
