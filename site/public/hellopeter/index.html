<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Hello Peter</title>
  <!-- Target of the QR code on the Peterbox home screen. Standalone page, outside the React app. -->
  <style>
    html, body { margin: 0; height: 100%; background: #000; }
    body { display: flex; align-items: center; justify-content: center; }
    video { display: block; max-width: 100vw; max-height: 100vh; max-height: 100dvh; }
  </style>
</head>
<body>
  <video src="/video/hellopeter.mp4" controls playsinline preload="auto"></video>
  <script>
    // Try to start with sound. Phones usually block that until a tap,
    // in which case the native play button is already showing.
    document.querySelector('video').play().catch(function () {});
  </script>
</body>
</html>
