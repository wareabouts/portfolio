<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alex Fiel - Creative Technologist</title>
    <meta
      name="description"
      content="Projects by Alex Fiel, a Creative Technologist based in Seattle."
    />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Alex Fiel" />
    <meta property="og:title" content="Alex Fiel - Creative Technologist" />
    <meta
      property="og:description"
      content="Projects by Alex Fiel, a Creative Technologist based in Seattle."
    />
    <meta property="og:image" content="/og-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#131316" />
    <!-- Paint the background before the stylesheet lands, so a dark-mode load never
         flashes white. -->
    <style>
      html { background: #131316; }
      html[data-theme='light'] { background: #fff; }
    </style>
    <!-- Runs before first paint: applies the saved theme, defaulting to dark. It only
         touches <html>, never #root, so React hydration is unaffected. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme')
          document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark'
        } catch (e) {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
